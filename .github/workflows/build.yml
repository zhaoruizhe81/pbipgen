name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate both examples
        run: |
          python3 pbipgen.py examples/finance/spec.json
          python3 pbipgen.py examples/sales/spec.json

      - name: Assert PBIP invariants
        run: python3 tools/check.py build/finance/FinanceDemo build/sales/SalesDemo

      - name: Reject an unknown role
        run: python3 tools/check_reject.py
